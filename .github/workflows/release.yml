name: Release anlegen

# Legt beim Setzen eines Versions-Tags ein GitHub-Release an und haengt die Auslieferung an.
# Ergebnis: https://github.com/Vexx-oss/NetLab/releases
#
# Warum ein Ablauf und nicht von Hand: Ein Release ueber die API anzulegen braucht ein
# Token mit Schreibrecht. Auf dem Entwicklungsrechner liegt keines (die API antwortet
# dort mit 401, gemessen 06.10.2026); ein Ablauf bekommt von GitHub dagegen ein
# GITHUB_TOKEN, und mit `permissions: contents: write` darf er Releases anlegen.
#
# Was angehaengt wird (vier Anhaenge):
#   * Netzwerk-Labor-<fassung>-Browser.zip   — Paket aus `tools/paket.py --ohne-exe` (Linux-Job)
#                                              NUR die Browser-Fassung; `--ohne-exe` ist Pflicht,
#                                              sonst nimmt das Werkzeug die lokale, veraltete
#                                              `Programm/Netzwerk-Labor.exe` mit (gemessen 09.10.2026)
#   * Netzwerk-Labor.html                    — Einzeldatei, stabiler Name fuer
#                                              /releases/latest/download/Netzwerk-Labor.html
#   * Netzwerk-Labor.exe                     — Windows-Programm, gebaut im Windows-Job aus DIESEM
#                                              Commit (stabiler Name: .../latest/download/Netzwerk-Labor.exe)
#   * Netzwerk-Labor-<fassung>-Android.apk   — Android-Fassung, gebaut im Android-Job aus DIESEM
#                                              Commit, z. B. Netzwerk-Labor-2.0.0-Android.apk.
#                                              Bis zum 09.10.2026 fehlte sie im Release: wer ueber
#                                              die Release-Seite kam, sah die Android-Fassung nicht.
#
# Die .exe liegt weiterhin NICHT im Git (8 MB, jeder Bau eine neue Binaerdatei). Bis zum
# 07.10.2026 fehlte sie deshalb ganz im Release; seit dem 07.10.2026 baut der zweite Job
# sie auf einem Windows-Laeufer und haengt sie an. Er laeuft NACH dem Linux-Job (`needs`),
# damit das Release schon existiert; die Bauart ist dieselbe wie auf dem Entwicklungsrechner
# (`python bauen.py` -> `cargo build --release --features custom-protocol`, gemessen
# 07.10.2026: 3 m 45 s, 8.217.088 B, Start mit tools/q-echt.py geprueft).
#
# Aufruf: Tag setzen und pushen.
#   git tag -a v2.0.4 -m "Netzwerk-Labor 2.0.4"
#   git push origin v2.0.4
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, fuer den ein Release angelegt werden soll (muss schon existieren)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release bauen und anlegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Erst pruefen: ein Release soll keinen kaputten Stand veroeffentlichen.
      - name: Tests (headless, Node)
        run: sh tools/test.sh

      - name: Einzeldatei bauen und pruefen
        run: |
          python tools/einfach.py
          python tools/einfach.py --pruefen docs/index.html

      # `--ohne-exe` ist PFLICHT, nicht Geschmack: ohne den Schalter nimmt `tools/paket.py`
      # `Programm/Netzwerk-Labor.exe`, wenn sie da ist — und das ist die LOKALE, meist veraltete
      # Binärdatei. Gemessen am 09.10.2026: sie trug noch 1.2.3, wäre aber als
      # `Netzwerk-Labor-1.2.4-Windows.zip` veröffentlicht worden. Die echte `.exe` baut der
      # Windows-Job unten aus DIESEM Commit und hängt sie einzeln an (Prüfung dort: ProductVersion
      # muss zum Tag passen). Der Linux-Job liefert deshalb nur die Browser-Fassung, und die heißt
      # dann auch so: `Netzwerk-Labor-<fassung>-Browser.zip` — genau der Name, den README.md und
      # docs/Liesmich.md verlinken.
      - name: Auslieferungspaket bauen (Browser-Fassung)
        run: python tools/paket.py --ohne-exe

      - name: Tag bestimmen
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release anlegen und Pakete anhaengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.name }}"
          echo "Tag: $TAG"
          ls -la dist/

          ZIPS=$(ls dist/*.zip | tr '\n' ' ')
          EINZEL=$(ls dist/Netzwerk-Labor-*/Netzwerk-Labor.html)
          echo "Anhaenge: $ZIPS $EINZEL"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Netzwerk-Labor ${TAG#v}" --generate-notes
          fi

          # Gleichnamige Anhaenge zuerst ausdruecklich entfernen, dann hochladen.
          # `gh release upload --clobber` scheitert genau hier mit
          #   HTTP 404: Not Found (…/releases/<id>/assets?name=Netzwerk-Labor.html)
          # (gemessen am 07.10.2026 beim zweiten Anlauf fuer dasselbe Tag) — der
          # Name ist nach dem Loeschen serverseitig kurz belegt. Deshalb: loeschen,
          # kurz warten, hochladen, bei Fehlschlag wiederholen.
          for f in $ZIPS "$EINZEL"; do
            n=$(basename "$f")
            gh release delete-asset "$TAG" "$n" -y >/dev/null 2>&1 && echo "Alter Anhang entfernt: $n"
          done
          sleep 5

          ok=0
          for versuch in 1 2 3; do
            if gh release upload "$TAG" $ZIPS "$EINZEL"; then ok=1; break; fi
            echo "Versuch $versuch gescheitert — neuer Versuch in 10 s"
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "FEHLER: Anhaenge konnten nicht hochgeladen werden."; exit 1; }

          echo "Anhaenge im Release:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name) — \(.size) Bytes"'

      - name: Ergebnis melden
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.tag.outputs.name }}"

  windows:
    name: Windows-Programm bauen und anhaengen
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Werkzeugketten sind auf windows-latest vorhanden (rustup mit stable, MSVC).
      # Versionen zeigen, damit im Protokoll steht, womit gebaut wurde.
      - name: Werkzeuge zeigen
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          python --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target
          key: windows-cargo-${{ hashFiles('shell/src-tauri/Cargo.lock') }}

      # Die Huelle laedt web/ — ohne diesen Schritt zeigt das Fenster den alten Stand.
      - name: Web-Fassung bauen
        run: python bauen.py

      - name: Huelle bauen (Release, ohne Buendel)
        working-directory: shell/src-tauri
        run: cargo build --release --features custom-protocol

      - name: Fassung gegenpruefen und fuer den Anhang bereitlegen
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $soll = $tag -replace '^v',''
          $exe = "shell/src-tauri/target/release/netzwerk-labor.exe"
          if (-not (Test-Path $exe)) { throw "Nicht gebaut: $exe" }
          $ist = (Get-Item $exe).VersionInfo.ProductVersion
          "Tag $tag — erwartete Fassung $soll, gemessene Fassung $ist"
          if ($ist -ne $soll) { throw "Die .exe meldet $ist, der Tag verlangt $soll — nicht anhaengen." }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist/Netzwerk-Labor.exe -Force
          $f = Get-Item dist/Netzwerk-Labor.exe
          "Anhang: {0} Bytes, SHA256 {1}" -f $f.Length, (Get-FileHash $f.FullName).Hash

      - name: Windows-Programm an das Release haengen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          # Wie im Linux-Job: erst einen gleichnamigen alten Anhang entfernen, dann
          # hochladen — `--clobber` scheitert beim Ersetzen mit HTTP 404.
          gh release delete-asset $tag Netzwerk-Labor.exe -y 2>$null
          Start-Sleep -Seconds 5
          $ok = $false
          foreach ($versuch in 1..3) {
            gh release upload $tag dist/Netzwerk-Labor.exe
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            "Versuch $versuch gescheitert — neuer Versuch in 10 s"
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw "Die .exe konnte nicht angehaengt werden." }
          gh release view $tag --json assets --jq '.assets[] | "  \(.name) — \(.size) Bytes"'

  # Vierter Anhang: die Android-APK. Eigener Job wie der Windows-Job (`needs: release`, damit das
  # Release schon existiert) — aber NICHT in dessen Kette: faellt der Android-Bau aus, sind die
  # drei anderen Anhaenge trotzdem dran.
  android:
    name: Android-APK bauen und anhaengen
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Werkzeuge zeigen, damit im Protokoll steht, womit gebaut wurde (wie im Windows-Job).
      # `android/bauen.py` braucht ein SDK mit build-tools >= 35 (deren d8 uebersetzt
      # verschachtelte Klassen; 34.0.0 bricht ab, gemessen 06.10.2026) und ein JDK mit
      # javac/keytool. Der Laeufer bringt beides mit — hier steht, welche Fassungen.
      - name: Werkzeuge zeigen
        run: |
          java -version
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK/build-tools" || true
          ls "$SDK/platforms" || true

      # Der Signaturschluessel liegt bewusst NICHT im Git (.gitignore: android/signatur/).
      # Ohne ihn erzeugt `android/bauen.py` einen NEUEN Schluessel (bauen.py:388-393) — die APK
      # waere dann bei jeder Auslieferung anders signiert und liesse sich nicht mehr ueber eine
      # alte Fassung installieren („App nicht installiert“). Deshalb kommt er aus zwei Secrets:
      #   ANDROID_KEYSTORE_B64       — android/signatur/netzwerk-labor.jks, base64-kodiert
      #   ANDROID_KEYSTORE_PASSWORT  — das Passwort aus android/signatur/zugang.txt
      #
      # DREI ZUSTAENDE statt zwei. Gemessen am 09.10.2026 am Lauf fuer v2.0.1: ohne die Secrets
      # stand das ganze Release auf rot, obwohl die drei anderen Anhaenge da waren — ein rotes X,
      # das dauerhaft leuchtet, wird ignoriert, und dann uebersieht man den Fall, in dem wirklich
      # etwas kaputt ist.
      #   1. Secrets fehlen          → dieser Job endet GRUEN, gibt eine ::warning:: aus, und die
      #                                Android-Schritte werden uebersprungen (`if: … == 'ja'`).
      #   2. Secrets da, Bau laeuft  → APK bauen, Fassung pruefen, anhaengen.
      #   3. Secrets da, Bau scheitert → ::error:: und failure. Das ist der Fall, der rot sein MUSS.
      # `secrets.*` ist in einem `if:` auf Job-Ebene nicht erlaubt — daher der Umweg ueber den
      # Job-Output DIESES Schritts (die folgenden Schritte haengen an `steps.schluessel.outputs.da`).
      - name: Secrets pruefen (Android-Schluessel vorhanden?)
        id: schluessel
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORT" ]; then
            echo "da=nein" >> "$GITHUB_OUTPUT"
            echo "::warning::Android-APK uebersprungen: ANDROID_KEYSTORE_B64/ANDROID_KEYSTORE_PASSWORT sind nicht gesetzt. Anleitung: Settings > Secrets and variables > Actions. Ohne den Originalschluessel waere die APK anders signiert und liesse sich nicht ueber eine alte Fassung installieren."
            exit 0
          fi
          echo "da=ja" >> "$GITHUB_OUTPUT"
          echo "Schluessel-Secrets sind gesetzt — die APK wird gebaut."

      - name: Signaturschluessel bereitstellen
        if: steps.schluessel.outputs.da == 'ja'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
        run: |
          set -e
          mkdir -p android/signatur
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/signatur/netzwerk-labor.jks
          printf 'Passwort:   %s\n' "$KEYSTORE_PASSWORT" > android/signatur/zugang.txt
          ls -l android/signatur

      # Hausregel: bauen.py laeuft vor jedem Bau (auch wenn tools/einfach.py web/ selbst
      # erzeugen wuerde, einfach.py:103-120). android/bauen.py baut daraus die Einzeldatei,
      # uebersetzt Java, packt die APK und signiert sie.
      - name: Web-Fassung bauen
        if: steps.schluessel.outputs.da == 'ja'
        run: python bauen.py

      - name: Android-APK bauen und Fassung gegenpruefen
        if: steps.schluessel.outputs.da == 'ja'
        run: |
          set -e
          python android/bauen.py
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          SOLL="${TAG#v}"
          APK="Programm/Netzwerk-Labor-${SOLL}-Android.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Erwartet wurde $APK — der Bau hat eine andere Fassung erzeugt:"
            ls -l Programm/*-Android.apk || true
            exit 1
          fi
          ls -l "$APK"
          sha256sum "$APK"

      - name: Android-APK an das Release haengen
        if: steps.schluessel.outputs.da == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          APK="Programm/Netzwerk-Labor-${TAG#v}-Android.apk"
          NAME=$(basename "$APK")
          # Wie im Linux-Job: erst einen gleichnamigen alten Anhang entfernen, dann hochladen —
          # `--clobber` scheitert beim Ersetzen mit HTTP 404 (gemessen 07.10.2026).
          gh release delete-asset "$TAG" "$NAME" -y >/dev/null 2>&1 && echo "Alter Anhang entfernt: $NAME"
          sleep 5
          ok=0
          for versuch in 1 2 3; do
            if gh release upload "$TAG" "$APK"; then ok=1; break; fi
            echo "Versuch $versuch gescheitert — neuer Versuch in 10 s"
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "FEHLER: Die APK konnte nicht angehaengt werden."; exit 1; }
          echo "Anhaenge im Release:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name) — \(.size) Bytes"'

      # Zum Schluss immer die Anhangsliste — auch wenn oben uebersprungen (Zustand 1) oder
      # gescheitert (Zustand 3) wurde. So steht in jedem Fall im Protokoll, was am Release haengt.
      - name: Anhaenge im Release zeigen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if [ "${{ steps.schluessel.outputs.da }}" = "ja" ]; then
            echo "Android-APK: in diesem Lauf gebaut und angehaengt"
          else
            echo "Android-APK: uebersprungen (Secrets ANDROID_KEYSTORE_B64/ANDROID_KEYSTORE_PASSWORT fehlen)"
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name) — \(.size) Bytes"'
