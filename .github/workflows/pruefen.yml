name: Prüfen

# Läuft bei jedem Push und jedem Pull Request. Die Tests sind reines JavaScript ohne
# Browser und laufen deshalb auf einem nackten Ubuntu-Runner.
#
# Wichtig: Hier liegt NUR dieses Repositorium. Die FISI-Spielhalle liegt daneben nur auf
# dem Entwicklungsrechner. Jeder Schritt muss also ohne sie auskommen — genau das prüfen
# die Schritte „ohne Spielhalle" und „Bau aus der Kopie".
#
# Der nächtliche Lauf ist ein Rückfall: Am 05.10.2026 blieben mehrere Läufe dieses
# Ablaufs 15 Minuten ohne zugeteilten Läufer in der Warteschlange und wurden dann von
# GitHub abgebrochen (Status „cancelled", 0 Schritte, kein Runner). Das ist Verhalten der
# Plattform, nicht der Tests — nachgewiesen ist der Gegenbeweis: Lauf 37367258747 hatte
# alle 13 Schritte erfolgreich. Der Zeitplan stellt sicher, dass trotzdem regelmäßig
# gemessen wird, auch wenn ein Push-Lauf in der Warteschlange verfällt.
on:
  push:
    branches: [ausbau-1.2, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

# Je Zweig nur ein Lauf: Staut sich die Warteschlange (siehe oben), räumt ein neuer Lauf
# den alten ab, statt dass beide warten und beide verfallen.
concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests und Bauprüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (headless, Node)
        run: sh tools/test.sh

      - name: Klassen im JS gegen Regeln im CSS
        run: python tools/klassen.py

      - name: Simulation gegen den Referenzstand
        run: node tools/sim-stand.js

      - name: Tests und Simulationsvergleich ohne FISI-Spielhalle
        run: python tools/lernmotor-rueckfall.py

      - name: Programm-Fassung bauen (aus der Kopie des Lernmotors)
        run: python bauen.py

      - name: Einzeldatei bauen (DAS Spiel als eine Datei)
        run: python tools/einfach.py

      - name: Einzeldatei prüfen — darf keine Außenverweise haben
        run: python tools/einfach.py --pruefen docs/index.html

      - name: Bilder der Doku prüfen
        run: python tools/bilder.py --pruefen

      - name: GitHub-Abläufe selbst prüfen
        run: python tools/ablaeufe.py
