name: Spiel veröffentlichen

# Stellt das Spiel als EINZELDATEI auf GitHub Pages.
# Ergebnis: https://vexx-oss.github.io/NetLab/ — ein Klick, spielt sofort im
# Browser; dazu seit 07.10.2026 die Doku unter https://vexx-oss.github.io/NetLab/doku/.
# Kein Download, kein Entpacken, keine Installation.
#
# ACHTUNG: Der Kommentar nannte die Adresse früher „…/Side-Project/". Gemessen am 09.10.2026:
# diese Adresse antwortet mit HTTP 404, lebend ist ausschließlich „…/NetLab/" (so steht es auch
# in README.md und in tools/seite-pruefen.py). Wer die Adresse sucht: `NetLab` ist der Repositorium-
# Name, `Side-Project` war ein Arbeitstitel.
#
# Dieser Ablauf baut ABSICHTLICH nichts: Bauen und Prüfen macht „Prüfen"
# (.github/workflows/pruefen.yml) bei jedem Push. Hier wird nur die fertige,
# versionierte docs/index.html veröffentlicht — kurz und ohne Warteketten.
#
# Warum kein eigener „Ist Pages eingeschaltet?"-Job mehr (gemessen 05.10.2026):
# Ein zweiter Job wartete auf einen freien Läufer (die Läufe brauchten an diesem Abend
# 5–11 Minuten Anlauf), und nach 902 Sekunden brach GitHub den GESAMTEN Lauf ab — auch
# den bereits erfolgreichen Teil. Die Prüfung ist jetzt ein Schritt IM Job.
#
# EINMALIG VON HAND, falls Pages noch aus ist:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Solange Pages aus ist, wird der Deploy-Schritt übersprungen und der Lauf bleibt grün.
# Danach veröffentlicht jeder Push auf ausbau-1.2 automatisch.
on:
  push:
    branches: [ausbau-1.2]
  workflow_dispatch:

# Kein Pfadfilter hier. Er stand hier und war ein Fehler (gemessen 06.10.2026): er liess
# nur Aenderungen an docs/ durch. Wer Pages einschaltet, aendert aber nichts an docs/ —
# also lief der Ablauf nicht an, und die Seite blieb 404, obwohl Pages an war. Veroeffentlicht
# wird ohnehin immer die versionierte docs/index.html; der Ablauf ist kurz genug, um bei
# jedem Push zu laufen.

permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veröffentlichung gleichzeitig; ein neuerer Lauf darf den älteren ablösen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    name: Auf GitHub Pages stellen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ist Pages eingeschaltet?
        id: frage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "an=ja" >> "$GITHUB_OUTPUT"
            echo "Pages ist eingeschaltet."
          else
            echo "an=nein" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages noch aus::Es wird nichts veröffentlicht. Einmalig einschalten: Settings -> Pages -> Build and deployment -> Source: 'GitHub Actions'. Danach läuft dieser Ablauf von selbst."
          fi

      # Seit 07.10.2026 wird auch die DOKU ausgeliefert (vorher nur das Spiel). `docs/doku/` ist
      # versioniert (wie `docs/index.html`) und wird deshalb nur kopiert, nicht im Ablauf gebaut:
      # so bleibt der Deploy kurz und man sieht im Repositorium, was ausgeliefert wird.
      # `docs/bilder/HERKUNFT.md` wird ausgelassen — rohes Markdown gehört nicht ins Netz, und die
      # Datei steht als eigenes Dokument in der Doku (`docs/doku/HERKUNFT.html`).
      - name: Seiten zusammenstellen
        if: steps.frage.outputs.an == 'ja'
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          mkdir -p _site/bilder
          find docs/bilder -maxdepth 1 -type f ! -name '*.md' -exec cp {} _site/bilder/ \;
          cp -r docs/doku _site/doku
          touch _site/.nojekyll
          test -f _site/doku/index.html
          ls -la _site _site/doku | head -40

      # Gegenprüfung des Standes, der WIRKLICH hochgeht: fehlt eine Dokumentseite, bleibt ein
      # `[[…]]`-Verweis offen oder zeigt ein relativer Verweis ins Leere, bricht der Lauf ab,
      # statt eine kaputte Doku zu veröffentlichen.
      - name: Doku gegenprüfen (versionierter Stand)
        if: steps.frage.outputs.an == 'ja'
        run: python3 tools/seite.py --pruefen

      - uses: actions/upload-pages-artifact@v3
        if: steps.frage.outputs.an == 'ja'
        with:
          path: _site

      - id: deployment
        if: steps.frage.outputs.an == 'ja'
        uses: actions/deploy-pages@v4
