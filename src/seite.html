<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netzwerk-Labor</title>
<meta name="theme-color" content="#04070A">
<!-- Startbildschirm (§ 18: Grund #04070A, Emerald nur als Handlung/Ladebalken). Reines CSS:
     er steht VOR dem grossen Skript und verschwindet, sobald die App #app fuellt. -->
<style>
  #app:empty + script{display:none} /* Platzhalter, falls kein Startbild gebraucht wird */
  .lade-huelle{position:fixed; inset:0; display:grid; place-content:center; justify-items:center; gap:12px;
    background:#04070A; color:#E8F4ED; font:400 16px/1.5 system-ui, "Segoe UI", sans-serif}
  .lade-marke{font:800 34px/1.1 system-ui, "Segoe UI", sans-serif; letter-spacing:-.01em}
  .lade-text{font:400 12px/1 system-ui, sans-serif; color:#7C9386; letter-spacing:.08em; text-transform:uppercase}
  .lade-balken{width:180px; height:3px; border-radius:999px; background:rgba(163,255,214,.14); overflow:hidden}
  .lade-balken i{display:block; height:100%; width:40%; border-radius:inherit; background:#30E58B; animation:lade 1.1s ease-in-out infinite}
  @keyframes lade{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion: reduce){ .lade-balken i{animation:none; width:100%; opacity:.6} }
  @media (prefers-color-scheme: light){
    .lade-huelle{background:#F2F6F3; color:#0B1512}
    .lade-text{color:#5C7066}
    .lade-balken{background:#D2DED7}
    .lade-balken i{background:#0B7A4B}
  }
</style>
<!--SCHRIFTEN-->
<style>
/*STIL*/
</style>
</head>
<body>
<div id="app" aria-live="off"><div class="lade-huelle" role="status" aria-label="Netzwerk-Labor lädt"><span class="lade-marke">Netzwerk-Labor</span><span class="lade-text">lädt</span><span class="lade-balken" aria-hidden="true"><i></i></span></div></div>
<script>
/*SKRIPTE*/
</script>
</body>
</html>
