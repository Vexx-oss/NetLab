<!-- ===================================================================
     Warum diese Datei existiert
     ===================================================================
     Zwei Wege führen zu GitHub Pages, und beide sollen funktionieren:

     1. Quelle "GitHub Actions" (der Ablauf .github/workflows/seite.yml):
        Dort wird docs/index.html veröffentlicht — diese Datei ist dann
        gar nicht im Spiel.

     2. Quelle "Zweig" (z. B. ausbau-1.2, Ordner "/"): GitHub Pages sucht
        im Wurzelverzeichnis eine index.html. Ohne diese Datei antwortet die
        Seite mit "Site not found" (404) — obwohl Pages eingeschaltet ist.
        Gemessen am 06.10.2026, nachdem Pages eingeschaltet worden war.

     Beide Wege landen so beim selben Spiel. Diese Datei ist nur eine
     Weiterleitung; das Spiel selbst ist Netzwerk-Labor.html und liegt
     daneben.
     =================================================================== -->
